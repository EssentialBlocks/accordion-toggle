# Deploy to WP.org
name: Deploy to WordPress.org

# Deploys when a GitHub release is published.
on:
  release:
    types: [published]

permissions:
  contents: read

# Never run two SVN deploys at once; queue instead of cancelling mid-commit.
concurrency:
  group: deploy-wporg
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The 10up action publishes the tag name (minus a leading "v") as the SVN
      # tag, so all version sources must agree before anything is built.
      - name: Verify tag matches plugin version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          header=$(grep -m1 -E '^[[:space:]*]*Version:' accordion-toggle.php | sed -E 's/^[^:]*:[[:space:]]*//; s/[[:space:]]+$//')
          readme=$(grep -m1 -iE '^Stable tag:' readme.txt | sed -E 's/^[^:]*:[[:space:]]*//; s/[[:space:]]+$//')
          constant=$(grep -m1 -E "define\([[:space:]]*['\"]ACCORDION_BLOCK_VERSION['\"]" accordion-toggle.php | sed -E "s/.*,[[:space:]]*['\"]([^'\"]+)['\"].*/\1/")

          fail=0
          check() {
            if [ "$3" = "$tag" ]; then
              echo "$1: $3"
            else
              echo "::error file=$2::$1 is '$3' but the tag is '$tag'"
              fail=1
            fi
          }
          check "Version header" accordion-toggle.php "$header"
          check "Stable tag" readme.txt "$readme"
          check ACCORDION_BLOCK_VERSION accordion-toggle.php "$constant"
          exit $fail

      # The controls and style-handler submodules are private repos, which
      # GITHUB_TOKEN can't read. CONTROLS_PAT is a fine-grained PAT limited to
      # EssentialBlocks/controls and EssentialBlocks/style-handler with
      # Contents: read-only.
      - name: Resolve submodule commits
        id: submodules
        run: |
          echo "controls=$(git rev-parse HEAD:controls)" >> "$GITHUB_OUTPUT"
          echo "style_handler=$(git rev-parse HEAD:lib/style-handler)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          repository: EssentialBlocks/controls
          ref: ${{ steps.submodules.outputs.controls }}
          path: controls
          token: ${{ secrets.CONTROLS_PAT }}
          persist-credentials: false

      - uses: actions/checkout@v7
        with:
          repository: EssentialBlocks/style-handler
          ref: ${{ steps.submodules.outputs.style_handler }}
          path: lib/style-handler
          token: ${{ secrets.CONTROLS_PAT }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          # The tree pinned by yarn.lock is a Node 14/16-era tree:
          # eslint-plugin-jsdoc@36 caps at "^12 || ^14 || ^16", so 16 is the
          # highest version it installs cleanly on. Moves off the EOL Node 14.
          node-version: '16'

      - name: Running Install & Build
        # `npm install` ignored this repository's lockfile. yarn.lock is the only
        # lockfile tracked here -- package-lock.json was deleted in c349e30 -- and npm
        # reads only package-lock.json / npm-shrinkwrap.json. Every run therefore
        # re-resolved the "^" ranges against the current registry rather than the
        # pinned tree, which by 2026 meant webpack 5.110 / sass 1.103 / chokidar 5,
        # all requiring Node 18/20+. Newer webpack emits `Object.hasOwn` in its
        # generated runtime, and mini-css-extract-plugin executes that module inside
        # the Node process to extract the CSS, so the build failed on Node 14 with
        # "Object.hasOwn is not a function" while pointing at style.scss.
        #
        # Installing from the tracked lockfile pins webpack 5.75.0 / sass 1.56.2,
        # the tree this plugin is developed and released against.
        run: |
          yarn install --frozen-lockfile
          npm run build

      - name: WordPress Plugin Deploy
        id: deploy
        uses: 10up/action-wordpress-plugin-deploy@2.3.0
        env:
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
